spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:message_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: true

server:
  port: ${PORT:8080}
