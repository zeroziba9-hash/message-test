<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>회원가입 | 사내 메신저</title>
    <link rel="stylesheet" href="/css/auth.css" />
</head>

<body>
    <main class="auth-wrap">
        <section class="card">
            <h1>회원가입</h1>
            <p class="desc">아이디, 비밀번호, 닉네임을 입력해 주세요.</p>

            <label>아이디</label>
            <input id="username" placeholder="4~20자 소문자/숫자" />

            <label>비밀번호</label>
            <input id="password" type="password" placeholder="4~20자" />

            <label>비밀번호 확인</label>
            <input id="passwordConfirm" type="password" placeholder="비밀번호 재입력" />

            <label>닉네임</label>
            <input id="nickname" placeholder="2~20자" />

            <button id="signupBtn">회원가입</button>
            <p class="status" id="status"></p>
        </section>
    </main>

    <script>
        document.getElementById('signupBtn').addEventListener('click', signup);

        async function signup() {
            const payload = {
                username: document.getElementById('username').value.trim(),
                password: document.getElementById('password').value,
                passwordConfirm: document.getElementById('passwordConfirm').value,
                nickname: document.getElementById('nickname').value.trim()
            };

            const statusEl = document.getElementById('status');
            statusEl.textContent = '';
            statusEl.classList.remove('ok');

            const usernameRegex = /^[a-z0-9]{4,20}$/;
            if (!usernameRegex.test(payload.username)) {
                statusEl.textContent = '아이디는 4~20자의 소문자, 숫자만 가능합니다.';
                return;
            }
            if (payload.password.length < 4 || payload.password.length > 20) {
                statusEl.textContent = '비밀번호는 4~20자여야 합니다.';
                return;
            }
            if (payload.password !== payload.passwordConfirm) {
                statusEl.textContent = '비밀번호 확인이 일치하지 않습니다.';
                return;
            }
            if (payload.nickname.length < 2 || payload.nickname.length > 20) {
                statusEl.textContent = '닉네임은 2자 이상 20자 이하여야 합니다.';
                return;
            }

            const res = await fetch('/api/auth/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json().catch(() => ({}));
            if (!res.ok) {
                statusEl.textContent = data.message || '회원가입에 실패했습니다.';
                return;
            }

            statusEl.textContent = '회원가입 완료! 이 창을 닫고 로그인해 주세요.';
            statusEl.classList.add('ok');

            if (window.opener) {
                setTimeout(() => window.close(), 1200);
            }
        }
    </script>
</body>

</html>
