<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Message Test Console</title>
  <link rel="stylesheet" href="/css/ws-test.css" />
  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body>
  <div class="app" id="appRoot">
    <aside class="sidebar">
      <div class="brand">Message Test</div>

      <div class="section profile-box">
        <div class="label">내 닉네임</div>
        <div id="nicknameValue" class="nickname-value">사용자1</div>
        <div class="hint" id="roleLabel">역할: MEMBER</div>
        <div class="profile-actions">
          <button id="editProfileBtn">내 정보 수정</button>
          <button id="logoutBtn" class="danger-soft">로그아웃</button>
        </div>
      </div>

      <div class="section fixed-room">
        <div class="label">기본 채팅</div>
        <div class="room-fixed-name">자유채팅방</div>
        <div class="hint" id="permLabel">권한: 읽기 가능 / 쓰기 가능</div>
      </div>

      <div class="section list-section">
        <div class="list-title with-actions">
          <span>채팅방</span>
          <label class="mini-toggle admin-only hidden" id="manageModeWrap">
            <input type="checkbox" id="manageMode" /> 관리모드
          </label>
        </div>

        <div class="admin-add-row admin-only hidden" id="adminAddRow">
          <input id="newChannelName" placeholder="새 채팅방 이름" />
          <button id="addChannelBtn" class="btn-primary">추가</button>
        </div>

        <div class="channels" id="channelList"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <h1 id="roomTitle"># 자유채팅방</h1>
        <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">연결 끊김</span></div>
      </header>

      <section class="messages" id="messages"></section>

      <footer class="composer">
        <div>
          <textarea id="content" placeholder="메시지를 입력하세요 (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
          <div class="composer-tools">
            <button id="imageBtn" class="icon-btn" title="이미지 업로드" type="button">🖼️</button>
            <span class="hint">Enter: 전송 · Shift+Enter: 줄바꿈</span>
          </div>
          <input id="imageInput" type="file" accept="image/*" class="hidden" />
        </div>
        <button id="sendBtn" class="btn-primary">전송</button>
      </footer>
    </main>

    <aside class="rightbar" id="rightbar">
      <div class="rightbar-title">접속 중 <span id="onlineCount">0</span>명</div>
      <div class="online-users" id="onlineUsers"></div>
    </aside>
  </div>

  <div id="messageContextMenu" class="menu hidden">
    <button data-action="edit">메시지 수정</button>
    <button data-action="delete" class="danger">메시지 삭제</button>
  </div>

  <div id="userContextMenu" class="menu hidden">
    <button data-role="ADMIN">ADMIN으로 변경</button>
    <button data-role="MODERATOR">MODERATOR로 변경</button>
    <button data-role="MEMBER">MEMBER로 변경</button>
    <button data-role="GUEST">GUEST로 변경</button>
  </div>

  <script>
    let stompClient = null;
    const DEFAULT_CHANNEL = "자유채팅방";
    let currentChannel = DEFAULT_CHANNEL;

    const appRootEl = document.getElementById("appRoot");
    const nicknameValueEl = document.getElementById("nicknameValue");
    const contentEl = document.getElementById("content");
    const messagesEl = document.getElementById("messages");
    const roomTitleEl = document.getElementById("roomTitle");
    const statusTextEl = document.getElementById("statusText");
    const statusDotEl = document.getElementById("statusDot");
    const channelListEl = document.getElementById("channelList");
    const onlineUsersEl = document.getElementById("onlineUsers");
    const onlineCountEl = document.getElementById("onlineCount");
    const roleLabelEl = document.getElementById("roleLabel");
    const permLabelEl = document.getElementById("permLabel");
    const manageModeWrapEl = document.getElementById("manageModeWrap");
    const manageModeEl = document.getElementById("manageMode");
    const adminAddRowEl = document.getElementById("adminAddRow");
    const newChannelNameEl = document.getElementById("newChannelName");
    const messageMenuEl = document.getElementById("messageContextMenu");
    const userMenuEl = document.getElementById("userContextMenu");
    const imageBtnEl = document.getElementById("imageBtn");
    const imageInputEl = document.getElementById("imageInput");

    let currentRole = "MEMBER";
    let selectedMessage = null;
    let selectedUser = null;
    let dragChannel = null;
    const unreadCounts = new Map();
    const lastSeenMessageId = new Map();

    const storedNickname = sessionStorage.getItem("chat.nickname")
      || localStorage.getItem("chat.nickname")
      || "사용자1";
    sessionStorage.setItem("chat.nickname", storedNickname);

    let currentNickname = storedNickname;
    applyNickname(currentNickname);
    loadSeenState();

    document.getElementById("sendBtn").addEventListener("click", sendMsg);
    document.getElementById("addChannelBtn").addEventListener("click", addChannel);
    document.getElementById("editProfileBtn").addEventListener("click", editProfile);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    imageBtnEl.addEventListener("click", () => imageInputEl.click());
    imageInputEl.addEventListener("change", onImageSelected);
    manageModeEl.addEventListener("change", loadChannels);
    messageMenuEl.addEventListener("click", onMessageMenuClick);
    userMenuEl.addEventListener("click", onUserMenuClick);
    document.addEventListener("click", hideMenus);

    contentEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMsg();
      }
    });

    contentEl.addEventListener("focus", () => {
      setTimeout(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }, 120);
    });

    if (window.visualViewport) {
      const syncViewport = () => {
        document.documentElement.style.setProperty("--vvh", `${window.visualViewport.height}px`);
        messagesEl.scrollTop = messagesEl.scrollHeight;
      };
      window.visualViewport.addEventListener("resize", syncViewport);
      syncViewport();
    }

    function showToast(message) {
      const prev = document.querySelector(".toast");
      if (prev) prev.remove();
      const toast = document.createElement("div");
      toast.className = "toast";
      toast.textContent = message;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2200);
    }

    function applyNickname(name) {
      currentNickname = (name || "").trim();
      nicknameValueEl.textContent = currentNickname || "(닉네임 없음)";
    }

    function sender() { return currentNickname; }

    function setStatus(connected, label = null) {
      statusTextEl.textContent = label || (connected ? "연결됨" : "연결 끊김");
      statusDotEl.classList.toggle("ok", connected);
    }

    function canManageMessage(msg) {
      const mine = (msg.sender || "") === sender();
      return mine || currentRole === "ADMIN";
    }

    function renderMessage(msg, mine = false) {
      const wrap = document.createElement("article");
      wrap.className = "message" + (mine ? " mine" : "");
      if (msg.id) wrap.dataset.messageId = String(msg.id);

      const sentAt = msg.sentAt ? new Date(msg.sentAt).toLocaleTimeString() : new Date().toLocaleTimeString();
      const rawContent = msg.content || "";
      const isSystem = (msg.sender || "") === "시스템";
      if (isSystem) wrap.classList.add("system");
      const imageUrl = extractImageUrl(rawContent);
      const firstUrl = imageUrl ? null : extractFirstUrl(rawContent);
      const textOnly = imageUrl ? "" : linkifyText(rawContent);

      wrap.innerHTML = `
        <div class="meta">
          <strong class="sender">${escapeHtml(msg.sender || "알수없음")}</strong>
          <span>${escapeHtml(sentAt)}</span>
        </div>
        <div class="content">${textOnly}</div>
      `;

      if (canManageMessage(msg)) {
        const menuBtn = document.createElement("button");
        menuBtn.type = "button";
        menuBtn.className = "msg-menu-btn";
        menuBtn.textContent = "⋮";
        menuBtn.title = "메시지 메뉴";
        menuBtn.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          selectedMessage = msg;
          const rect = menuBtn.getBoundingClientRect();
          openMenu(messageMenuEl, rect.left, rect.bottom + 6);
        });
        wrap.appendChild(menuBtn);
      }

      const senderEl = wrap.querySelector(".sender");
      if (currentRole === "ADMIN" && senderEl && msg.sender) {
        senderEl.style.cursor = "context-menu";
        senderEl.title = "우클릭: 사용자 권한 변경";
        senderEl.addEventListener("contextmenu", (event) => {
          event.preventDefault();
          event.stopPropagation();
          selectedUser = msg.sender;
          openMenu(userMenuEl, event.clientX, event.clientY);
        });
      }

      const contentBodyEl = wrap.querySelector(".content");

      if (imageUrl) {
        const img = document.createElement("img");
        img.className = "chat-image";
        img.src = imageUrl;
        img.alt = "업로드 이미지";
        img.loading = "lazy";
        contentBodyEl?.appendChild(img);
      } else if (firstUrl && contentBodyEl) {
        appendLinkPreview(contentBodyEl, firstUrl);
      }

      wrap.addEventListener("contextmenu", (event) => {
        if (canManageMessage(msg)) {
          event.preventDefault();
          selectedMessage = msg;
          openMenu(messageMenuEl, event.clientX, event.clientY);
        }
      });

      messagesEl.appendChild(wrap);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function clearMessages() { messagesEl.innerHTML = ""; }

    function seenStorageKey() {
      return `chat.seen.${sender() || "anonymous"}`;
    }

    function loadSeenState() {
      try {
        const raw = sessionStorage.getItem(seenStorageKey());
        if (!raw) return;
        const data = JSON.parse(raw);
        Object.entries(data || {}).forEach(([channelId, seenId]) => {
          const n = Number(seenId || 0);
          if (n > 0) lastSeenMessageId.set(channelId, n);
        });
      } catch {
        // ignore corrupted seen state
      }
    }

    function saveSeenState() {
      try {
        const obj = Object.fromEntries(lastSeenMessageId.entries());
        sessionStorage.setItem(seenStorageKey(), JSON.stringify(obj));
      } catch {
        // ignore storage errors
      }
    }

    function setSeen(channelId, messageId) {
      const id = Number(messageId || 0);
      if (id <= 0) return;
      const prev = Number(lastSeenMessageId.get(channelId) || 0);
      if (id >= prev) {
        lastSeenMessageId.set(channelId, id);
        saveSeenState();
      }
    }

    function markChannelSeen(channelId, messages) {
      const maxId = (messages || []).reduce((max, m) => Math.max(max, Number(m.id || 0)), 0);
      setSeen(channelId, maxId);
      unreadCounts.set(channelId, 0);
    }

    function updateRoomTitle() {
      roomTitleEl.textContent = `# ${currentChannel}`;
    }

    function renderPresence(snapshot) {
      const users = snapshot?.users || [];
      onlineCountEl.textContent = snapshot?.onlineCount ?? users.length;
      onlineUsersEl.innerHTML = "";

      if (users.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "접속 중인 사용자가 없습니다.";
        onlineUsersEl.appendChild(empty);
        return;
      }

      users.forEach(user => {
        const item = document.createElement("div");
        item.className = "online-user";
        item.innerHTML = `<span class="user-dot"></span><span>${escapeHtml(user)}</span>`;

        if (currentRole === "ADMIN") {
          item.addEventListener("contextmenu", (event) => {
            event.preventDefault();
            selectedUser = user;
            openMenu(userMenuEl, event.clientX, event.clientY);
          });
        }

        onlineUsersEl.appendChild(item);
      });
    }

    function extractErrorMessage(data, fallback) {
      if (data?.details?.length) return data.details[0];
      if (data?.message) return data.message;
      return fallback;
    }

    function unwrapApiPayload(body, fallback = null) {
      if (body && typeof body === "object" && "success" in body) {
        return body.data ?? fallback;
      }
      return body ?? fallback;
    }

    async function refreshAccess() {
      if (!sender()) return;
      try {
        const res = await fetch(`/api/access/${encodeURIComponent(currentChannel)}?sender=${encodeURIComponent(sender())}`);
        if (!res.ok) return;
        const body = await res.json().catch(() => ({}));
        const access = unwrapApiPayload(body, {});
        currentRole = access.role || "MEMBER";
        roleLabelEl.textContent = `역할: ${currentRole}`;
        appRootEl.classList.toggle("is-admin", currentRole === "ADMIN");
        permLabelEl.textContent = `권한: ${access.canRead ? "읽기 가능" : "읽기 불가"} / ${access.canWrite ? "쓰기 가능" : "쓰기 불가"}`;
        manageModeWrapEl.classList.toggle("hidden", currentRole !== "ADMIN");
        adminAddRowEl.classList.toggle("hidden", currentRole !== "ADMIN");
      } catch {}
    }

    function connect() {
      if (!sender()) {
        showToast("닉네임이 없습니다. 내 정보 수정에서 설정해 주세요.");
        return;
      }

      updateRoomTitle();

      if (stompClient && stompClient.connected) {
        stompClient.disconnect(() => setStatus(false));
      }

      setStatus(false, "연결 중...");
      const socket = new SockJS("/ws");
      stompClient = Stomp.over(socket);
      stompClient.debug = null;

      stompClient.connect({}, async () => {
        setStatus(true);

        stompClient.subscribe(`/sub/channels/${currentChannel}`, (frame) => {
          const msg = JSON.parse(frame.body);

          if (handleRealtimeEvent(msg)) return;

          const mine = (msg.sender || "") === sender();
          renderMessage(msg, mine);
          if (msg?.id) setSeen(currentChannel, Number(msg.id));
        });

        stompClient.subscribe(`/sub/channels/${currentChannel}/presence`, (frame) => {
          renderPresence(JSON.parse(frame.body));
        });

        stompClient.send(`/pub/channels/${currentChannel}/join`, {}, JSON.stringify({ sender: sender(), content: "joined" }));
        await refreshAccess();
        await loadHistory();
        await refreshUnreadBadges();
        await loadChannels();
        await loadOnlineUsers();
      }, () => {
        setStatus(false);
        showToast("연결에 실패했습니다. 서버 상태를 확인해 주세요.");
      });
    }

    async function sendMsg() {
      if (!stompClient || !stompClient.connected) {
        connect();
        return;
      }

      const text = contentEl.value.trim();
      if (!sender() || !text) return;

      await refreshAccess();
      if (!permLabelEl.textContent.includes("쓰기 가능")) {
        showToast("이 채널에 쓰기 권한이 없습니다.");
        return;
      }

      stompClient.send(`/pub/channels/${currentChannel}`, {}, JSON.stringify({ sender: sender(), content: text }));
      contentEl.value = "";
      contentEl.focus();
    }

    async function loadHistory() {
      try {
        const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/messages?sender=${encodeURIComponent(sender())}&limit=50`);
        const body = await res.json().catch(() => ([]));
        const data = unwrapApiPayload(body, []);
        if (!res.ok) {
          clearMessages();
          renderMessage({ sender: "시스템", content: extractErrorMessage(body, "대화 기록 로드 실패"), sentAt: new Date() }, false);
          return;
        }
        clearMessages();
        data.forEach(msg => renderMessage(msg, (msg.sender || "") === sender()));
        markChannelSeen(currentChannel, data);
        await refreshUnreadBadges();
      } catch {
        showToast("대화 기록을 불러오지 못했습니다.");
      }
    }

    async function loadChannels() {
      try {
        const res = await fetch("/api/channels");
        if (!res.ok) throw new Error();
        const body = await res.json().catch(() => ([]));
        const channels = unwrapApiPayload(body, []);
        channelListEl.innerHTML = "";

        channels.forEach(ch => {
          const btn = document.createElement("button");
          btn.className = "channel-item" + (ch === currentChannel ? " active" : "");

          const nameSpan = document.createElement("span");
          nameSpan.textContent = `# ${ch}`;
          nameSpan.className = "ch-name";
          btn.appendChild(nameSpan);

          const unread = unreadCounts.get(ch) || 0;
          if (unread > 0 && ch !== currentChannel) {
            const badge = document.createElement("span");
            badge.className = "unread-badge";
            badge.textContent = unread > 99 ? "99+" : String(unread);
            btn.appendChild(badge);
          }

          btn.onclick = () => moveChannel(ch);

          const dragEnabled = currentRole === "ADMIN" && manageModeEl.checked;
          btn.draggable = dragEnabled;

          if (dragEnabled) {
            btn.addEventListener("dragstart", () => dragChannel = ch);
            btn.addEventListener("dragover", (e) => e.preventDefault());
            btn.addEventListener("drop", async (e) => {
              e.preventDefault();
              if (!dragChannel || dragChannel === ch) return;
              const updated = [...channels];
              const from = updated.indexOf(dragChannel);
              const to = updated.indexOf(ch);
              if (from < 0 || to < 0) return;
              updated.splice(from, 1);
              updated.splice(to, 0, dragChannel);
              await reorderChannels(updated);
            });
          }

          channelListEl.appendChild(btn);
        });
      } catch {
        showToast("채널 목록을 불러오지 못했습니다.");
      }
    }

    async function refreshUnreadBadges() {
      if (!sender()) return;
      try {
        const res = await fetch("/api/channels");
        if (!res.ok) return;
        const channelsBody = await res.json().catch(() => ([]));
        const channels = unwrapApiPayload(channelsBody, []);

        await Promise.all(channels.map(async (ch) => {
          if (ch === currentChannel) return;
          const msgRes = await fetch(`/api/channels/${encodeURIComponent(ch)}/messages?sender=${encodeURIComponent(sender())}&limit=100`);
          if (!msgRes.ok) return;
          const msgsBody = await msgRes.json().catch(() => ([]));
          const msgs = unwrapApiPayload(msgsBody, []);
          const seen = lastSeenMessageId.get(ch) || 0;
          const unread = msgs.filter(m => Number(m.id || 0) > seen).length;
          unreadCounts.set(ch, unread);
        }));
      } catch {
        // ignore unread polling errors
      }
    }

    async function moveChannel(channelId) {
      currentChannel = channelId;
      unreadCounts.set(channelId, 0);
      updateRoomTitle();
      connect();
    }

    async function addChannel() {
      const channelName = newChannelNameEl.value.trim();
      if (!channelName) return;

      const res = await fetch(`/api/admin/channels?sender=${encodeURIComponent(sender())}&channelId=${encodeURIComponent(channelName)}`, { method: "POST" });
      const data = await res.json().catch(() => ([]));
      if (!res.ok) {
        showToast(extractErrorMessage(data, "채널 추가 실패"));
        return;
      }

      newChannelNameEl.value = "";
      await loadChannels();
      showToast(`채널 #${channelName} 추가 완료`);
    }

    async function reorderChannels(nextOrder) {
      const res = await fetch(`/api/admin/channels/reorder?sender=${encodeURIComponent(sender())}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ channelIds: nextOrder })
      });

      const data = await res.json().catch(() => ([]));
      if (!res.ok) {
        showToast(extractErrorMessage(data, "채널 순서 변경 실패"));
        return;
      }
      await loadChannels();
    }

    async function loadOnlineUsers() {
      try {
        const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/online-users?sender=${encodeURIComponent(sender())}`);
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          renderPresence({ users: [], onlineCount: 0 });
          return;
        }
        renderPresence(unwrapApiPayload(data, {}));
      } catch {
        showToast("온라인 사용자 목록 조회 실패");
      }
    }

    function editProfile() {
      const next = prompt("새 닉네임을 입력하세요.", sender());
      if (!next || !next.trim()) return;
      applyNickname(next);
      sessionStorage.setItem("chat.nickname", sender());

      lastSeenMessageId.clear();
      unreadCounts.clear();
      loadSeenState();

      refreshAccess();
      loadOnlineUsers();
      loadChannels();
      showToast("닉네임이 변경되었습니다.");
    }

    function logout() {
      sessionStorage.removeItem(seenStorageKey());
      sessionStorage.removeItem("chat.nickname");
      sessionStorage.removeItem("chat.username");
      window.location.href = "/login.html";
    }

    function openMenu(menu, x, y) {
      messageMenuEl.classList.add("hidden");
      userMenuEl.classList.add("hidden");
      menu.style.left = `${x}px`;
      menu.style.top = `${y}px`;
      menu.classList.remove("hidden");
    }

    function hideMenus(event = null) {
      if (event?.target) {
        const insideMessageMenu = messageMenuEl.contains(event.target);
        const insideUserMenu = userMenuEl.contains(event.target);
        if (insideMessageMenu || insideUserMenu) return;
      }

      messageMenuEl.classList.add("hidden");
      userMenuEl.classList.add("hidden");
      selectedMessage = null;
      selectedUser = null;
    }

    async function onMessageMenuClick(event) {
      event.preventDefault();
      event.stopPropagation();

      const clickEl = event.target instanceof Element ? event.target : event.target?.parentElement;
      const actionEl = clickEl?.closest?.("button[data-action]");
      const action = actionEl?.dataset?.action;
      const targetMessage = selectedMessage;
      if (!action || !targetMessage?.id) {
        hideMenus();
        return;
      }

      if (action === "edit") {
        const next = prompt("수정할 메시지 내용을 입력하세요.", targetMessage.content || "");
        if (!next || !next.trim()) return hideMenus();

        const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/messages/${targetMessage.id}?sender=${encodeURIComponent(sender())}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ content: next.trim() })
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          showToast(extractErrorMessage(errorData, "메시지 수정 실패"));
          return hideMenus();
        }

        // 실시간 브로드캐스트로 화면이 갱신되므로 전체 히스토리 재로딩은 생략
        showToast("메시지 수정 완료");
      }

      if (action === "delete") {
        if (!confirm(`메시지 #${targetMessage.id}를 삭제할까요?`)) return hideMenus();

        const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/messages/${targetMessage.id}?sender=${encodeURIComponent(sender())}`, {
          method: "DELETE"
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({}));
          showToast(extractErrorMessage(errorData, "메시지 삭제 실패"));
          return hideMenus();
        }

        // 실시간 삭제 이벤트가 오면 해당 메시지 제거 + 시스템 안내를 렌더링함
        // (여기서 loadHistory를 호출하면 시스템 안내가 즉시 사라질 수 있음)
        showToast("메시지 삭제 완료");
      }

      hideMenus();
    }

    async function onUserMenuClick(event) {
      event.preventDefault();
      event.stopPropagation();

      const clickEl = event.target instanceof Element ? event.target : event.target?.parentElement;
      const roleEl = clickEl?.closest?.("button[data-role]");
      const role = roleEl?.dataset?.role;
      const targetUser = selectedUser;
      if (!role || !targetUser) {
        hideMenus();
        return;
      }

      const res = await fetch(`/api/admin/users/${encodeURIComponent(targetUser)}/role?actor=${encodeURIComponent(sender())}&role=${encodeURIComponent(role)}`, { method: "POST" });
      if (!res.ok) {
        showToast("권한 변경 실패");
        return hideMenus();
      }

      showToast(`${targetUser} 역할을 ${role}로 변경했습니다.`);
      await refreshAccess();
      await loadOnlineUsers();
      hideMenus();
    }

    async function onImageSelected(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        showToast("이미지 파일만 업로드할 수 있습니다.");
        imageInputEl.value = "";
        return;
      }

      const maxMb = 3;
      if (file.size > maxMb * 1024 * 1024) {
        showToast(`이미지는 ${maxMb}MB 이하만 업로드 가능합니다.`);
        imageInputEl.value = "";
        return;
      }

      const dataUrl = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result || ""));
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      if (!stompClient || !stompClient.connected) connect();
      if (!stompClient || !stompClient.connected) {
        showToast("채널 연결 후 다시 시도해 주세요.");
        imageInputEl.value = "";
        return;
      }

      await refreshAccess();
      if (!permLabelEl.textContent.includes("쓰기 가능")) {
        showToast("이 채널에 쓰기 권한이 없습니다.");
        imageInputEl.value = "";
        return;
      }

      stompClient.send(`/pub/channels/${currentChannel}`, {}, JSON.stringify({ sender: sender(), content: `[img]${dataUrl}` }));
      imageInputEl.value = "";
      showToast("이미지 전송 완료");
    }

    function handleRealtimeEvent(msg) {
      const deletedActor = extractDeletedEvent(msg);
      if (!deletedActor) return false;

      const targetId = Number(msg?.id || 0);
      if (targetId > 0) {
        const targetEl = messagesEl.querySelector(`[data-message-id="${targetId}"]`);
        if (targetEl) targetEl.remove();
      }

      renderMessage({
        sender: "시스템",
        sentAt: msg?.sentAt || new Date(),
        content: `메시지가 ${deletedActor}에 의해 삭제되었습니다.`
      }, false);
      return true;
    }

    function extractDeletedEvent(msg) {
      if (!msg || msg.sender !== "시스템") return null;
      const content = String(msg.content || "").trim();
      if (!content.startsWith("[deleted]")) return null;
      return content.slice(9).trim() || "관리자";
    }

    function extractImageUrl(content) {
      if (typeof content !== "string") return null;
      if (!content.startsWith("[img]")) return null;
      const url = content.slice(5).trim();
      return url.startsWith("data:image/") ? url : null;
    }

    function extractFirstUrl(content) {
      if (typeof content !== "string") return null;
      const match = content.match(/https?:\/\/[^\s]+/i);
      if (!match) return null;
      try {
        return new URL(match[0]).toString();
      } catch {
        return null;
      }
    }

    function linkifyText(content) {
      const escaped = escapeHtml(content || "");
      return escaped.replace(/(https?:\/\/[^\s<]+)/gi, (url) => {
        const safeUrl = url.replaceAll('"', '&quot;');
        return `<a class="chat-link" href="${safeUrl}" target="_blank" rel="noopener noreferrer">${url}</a>`;
      });
    }

    function appendLinkPreview(parentEl, url) {
      const parsed = parseYouTubeUrl(url);
      if (!parsed) return;

      const card = document.createElement("a");
      card.className = "link-preview";
      card.href = url;
      card.target = "_blank";
      card.rel = "noopener noreferrer";

      const thumb = document.createElement("img");
      thumb.className = "link-preview-thumb";
      thumb.alt = "video thumbnail";
      thumb.loading = "lazy";
      thumb.src = `https://img.youtube.com/vi/${parsed.id}/hqdefault.jpg`;

      const body = document.createElement("div");
      body.className = "link-preview-body";

      const providerEl = document.createElement("div");
      providerEl.className = "link-preview-provider";
      providerEl.textContent = "YouTube";

      const titleEl = document.createElement("div");
      titleEl.className = "link-preview-title";
      titleEl.textContent = "불러오는 중...";

      const authorEl = document.createElement("div");
      authorEl.className = "link-preview-author";
      authorEl.textContent = "";

      const urlEl = document.createElement("div");
      urlEl.className = "link-preview-url";
      urlEl.textContent = parsed.watchUrl;

      body.appendChild(providerEl);
      body.appendChild(titleEl);
      body.appendChild(authorEl);
      body.appendChild(urlEl);

      card.appendChild(thumb);
      card.appendChild(body);
      parentEl.appendChild(card);

      loadYouTubeMeta(parsed.watchUrl, titleEl, authorEl);
    }

    async function loadYouTubeMeta(watchUrl, titleEl, authorEl) {
      try {
        const endpoint = `https://www.youtube.com/oembed?format=json&url=${encodeURIComponent(watchUrl)}`;
        const res = await fetch(endpoint);
        if (!res.ok) throw new Error("oEmbed fetch failed");

        const data = await res.json();
        titleEl.textContent = data?.title?.trim() || "YouTube 영상";
        authorEl.textContent = data?.author_name?.trim() || "";
      } catch {
        titleEl.textContent = "YouTube 미리보기";
        authorEl.textContent = "";
      }
    }

    function parseYouTubeUrl(url) {
      try {
        const u = new URL(url);
        if (u.hostname.includes("youtu.be")) {
          const id = u.pathname.replace("/", "").trim();
          return id ? { id, watchUrl: `https://www.youtube.com/watch?v=${id}` } : null;
        }

        if (u.hostname.includes("youtube.com")) {
          const id = u.searchParams.get("v");
          return id ? { id, watchUrl: `https://www.youtube.com/watch?v=${id}` } : null;
        }
      } catch {}
      return null;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function tryRenderDemoScene() {
      const mode = new URLSearchParams(window.location.search).get("demo");
      if (!mode) return false;

      updateRoomTitle();
      setStatus(true, "데모 모드");
      clearMessages();

      if (mode === "link") {
        renderMessage({ sender: "관리자", content: "하이퍼링크 테스트\nhttps://youtu.be/dQw4w9WgXcQ", sentAt: new Date() }, true);
      } else {
        renderMessage({ sender: "시스템", content: `알 수 없는 demo 모드: ${mode}`, sentAt: new Date() }, false);
      }

      return true;
    }

    if (!tryRenderDemoScene()) {
      updateRoomTitle();
      loadChannels();
      refreshAccess();
      connect();

      setInterval(async () => {
        await refreshUnreadBadges();
        await loadChannels();
      }, 5000);
    }
  </script>
</body>
</html>
