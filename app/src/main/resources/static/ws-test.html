<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Message Test Console</title>
    <link rel="stylesheet" href="/css/ws-test.css" />
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>
    <div class="app" id="appRoot">
        <aside class="sidebar">
            <div class="brand">Message Test</div>

            <div class="section profile-box">
                <div class="label">내 닉네임</div>
                <div id="nicknameValue" class="nickname-value">사용자1</div>
                <div class="hint" id="roleLabel">역할: MEMBER</div>
                <div class="profile-actions">
                    <button id="editProfileBtn">내 정보 수정</button>
                    <button id="logoutBtn" class="danger-soft">로그아웃</button>
                </div>
            </div>

            <div class="section fixed-room">
                <div class="label">기본 채팅</div>
                <div class="room-fixed-name">자유채팅방</div>
                <div class="hint" id="permLabel">권한: 읽기 가능 / 쓰기 가능</div>
            </div>

            <div class="section list-section">
                <div class="list-title with-actions">
                    <span>채팅방</span>
                    <label class="mini-toggle admin-only hidden" id="manageModeWrap">
                        <input type="checkbox" id="manageMode" />
                        관리모드
                    </label>
                </div>

                <div class="admin-add-row admin-only hidden" id="adminAddRow">
                    <input id="newChannelName" placeholder="새 채팅방 이름" />
                    <button id="addChannelBtn" class="btn-primary">추가</button>
                </div>

                <div class="channels" id="channelList"></div>
            </div>

            <div class="section action-buttons admin-panel hidden" id="adminPanel">
                <div class="list-title">관리자 메뉴</div>
                <input id="adminTargetUser" placeholder="대상 사용자" value="사용자1" />
                <select id="adminRole">
                    <option>ADMIN</option>
                    <option>MODERATOR</option>
                    <option selected>MEMBER</option>
                    <option>GUEST</option>
                </select>
                <button id="setRoleBtn">사용자 역할 변경</button>

                <select id="permRole">
                    <option>ADMIN</option>
                    <option>MODERATOR</option>
                    <option selected>MEMBER</option>
                    <option>GUEST</option>
                </select>
                <label class="checkbox"><input type="checkbox" id="canRead" checked />읽기</label>
                <label class="checkbox"><input type="checkbox" id="canWrite" checked />쓰기</label>
                <button id="setPermBtn">채널 권한 변경</button>
                <div class="hint">메시지 우클릭 시 수정/삭제 메뉴가 열립니다.</div>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <h1 id="roomTitle"># 자유채팅방</h1>
                <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">연결 끊김</span></div>
            </header>

            <section class="messages" id="messages"></section>

            <footer class="composer">
                <div>
                    <textarea id="content" placeholder="메시지를 입력하세요 (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>
                    <div class="hint">Enter: 전송 · Shift+Enter: 줄바꿈</div>
                </div>
                <button id="sendBtn" class="btn-primary">전송</button>
            </footer>
        </main>

        <aside class="rightbar">
            <div class="rightbar-title">접속 중 <span id="onlineCount">0</span>명</div>
            <div class="online-users" id="onlineUsers"></div>
        </aside>
    </div>

    <div id="messageContextMenu" class="message-menu hidden">
        <button data-action="edit">메시지 수정</button>
        <button data-action="delete" class="danger">메시지 삭제</button>
    </div>

    <script>
        let stompClient = null;
        const DEFAULT_CHANNEL = "자유채팅방";
        let currentChannel = DEFAULT_CHANNEL;

        const appRootEl = document.getElementById("appRoot");
        const nicknameValueEl = document.getElementById("nicknameValue");
        const contentEl = document.getElementById("content");
        const messagesEl = document.getElementById("messages");
        const roomTitleEl = document.getElementById("roomTitle");
        const statusTextEl = document.getElementById("statusText");
        const statusDotEl = document.getElementById("statusDot");
        const channelListEl = document.getElementById("channelList");
        const onlineUsersEl = document.getElementById("onlineUsers");
        const onlineCountEl = document.getElementById("onlineCount");
        const roleLabelEl = document.getElementById("roleLabel");
        const permLabelEl = document.getElementById("permLabel");
        const adminPanelEl = document.getElementById("adminPanel");
        const messageMenuEl = document.getElementById("messageContextMenu");
        const manageModeWrapEl = document.getElementById("manageModeWrap");
        const manageModeEl = document.getElementById("manageMode");
        const adminAddRowEl = document.getElementById("adminAddRow");
        const newChannelNameEl = document.getElementById("newChannelName");
        const adminTargetUserEl = document.getElementById("adminTargetUser");

        let currentRole = "MEMBER";
        let selectedMessageId = null;
        let dragChannel = null;
        let currentNickname = localStorage.getItem('chat.nickname') || "사용자1";

        applyNickname(currentNickname);

        document.getElementById("sendBtn").addEventListener("click", sendMsg);
        document.getElementById("setRoleBtn").addEventListener("click", setUserRole);
        document.getElementById("setPermBtn").addEventListener("click", setChannelPermission);
        document.getElementById("addChannelBtn").addEventListener("click", addChannel);
        document.getElementById("editProfileBtn").addEventListener("click", editProfile);
        document.getElementById("logoutBtn").addEventListener("click", logout);
        manageModeEl.addEventListener("change", loadChannels);
        messageMenuEl.addEventListener("click", onMessageMenuClick);

        document.addEventListener("click", () => hideMessageMenu());

        contentEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter" && !e.shiftKey) {
                e.preventDefault();
                sendMsg();
            }
        });

        function showToast(message) {
            const prev = document.querySelector('.toast');
            if (prev) prev.remove();
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2200);
        }

        function applyNickname(name) {
            currentNickname = name.trim();
            nicknameValueEl.textContent = currentNickname;
            adminTargetUserEl.value = currentNickname;
        }

        function sender() { return currentNickname; }

        function setStatus(connected, label = null) {
            statusTextEl.textContent = label || (connected ? "연결됨" : "연결 끊김");
            statusDotEl.classList.toggle("ok", connected);
        }

        function renderMessage(msg, mine = false) {
            const wrap = document.createElement("article");
            wrap.className = "message" + (mine ? " mine" : "");
            if (msg.id) wrap.dataset.messageId = String(msg.id);

            const sentAt = msg.sentAt ? new Date(msg.sentAt).toLocaleTimeString() : new Date().toLocaleTimeString();
            wrap.innerHTML = `
                <div class="meta">
                    <strong class="sender">${escapeHtml(msg.sender || "알수없음")}</strong>
                    <span>${escapeHtml(sentAt)}</span>
                </div>
                <div class="content">${escapeHtml(msg.content || "")}</div>
            `;

            wrap.addEventListener("contextmenu", (event) => {
                if (currentRole !== "ADMIN" || !msg.id) return;
                event.preventDefault();
                openMessageMenu(msg.id, event.clientX, event.clientY);
            });

            messagesEl.appendChild(wrap);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function clearMessages() { messagesEl.innerHTML = ""; }

        function updateRoomTitle() {
            roomTitleEl.textContent = `# ${currentChannel}`;
        }

        function renderPresence(snapshot) {
            const users = snapshot?.users || [];
            onlineCountEl.textContent = snapshot?.onlineCount ?? users.length;
            onlineUsersEl.innerHTML = "";

            if (users.length === 0) {
                const empty = document.createElement("div");
                empty.className = "empty";
                empty.textContent = "접속 중인 사용자가 없습니다.";
                onlineUsersEl.appendChild(empty);
                return;
            }

            users.forEach(user => {
                const item = document.createElement("div");
                item.className = "online-user";
                item.innerHTML = `<span class="user-dot"></span><span>${escapeHtml(user)}</span>`;
                onlineUsersEl.appendChild(item);
            });
        }

        function extractErrorMessage(data, fallback) {
            if (data?.details?.length) return data.details[0];
            if (data?.message) return data.message;
            return fallback;
        }

        async function refreshAccess() {
            if (!sender()) return;
            try {
                const res = await fetch(`/api/access/${encodeURIComponent(currentChannel)}?sender=${encodeURIComponent(sender())}`);
                if (!res.ok) return;
                const access = await res.json();
                currentRole = access.role || "MEMBER";
                roleLabelEl.textContent = `역할: ${currentRole}`;
                appRootEl.classList.toggle("is-admin", currentRole === "ADMIN");
                permLabelEl.textContent = `권한: ${access.canRead ? "읽기 가능" : "읽기 불가"} / ${access.canWrite ? "쓰기 가능" : "쓰기 불가"}`;
                document.getElementById("canRead").checked = access.canRead;
                document.getElementById("canWrite").checked = access.canWrite;
                adminPanelEl.classList.toggle("hidden", currentRole !== "ADMIN");
                manageModeWrapEl.classList.toggle("hidden", currentRole !== "ADMIN");
                adminAddRowEl.classList.toggle("hidden", currentRole !== "ADMIN");
            } catch {
                // ignore
            }
        }

        function connect() {
            if (!sender()) {
                showToast('닉네임이 없습니다. 내 정보 수정에서 설정해 주세요.');
                return;
            }

            updateRoomTitle();

            if (stompClient && stompClient.connected) {
                stompClient.disconnect(() => setStatus(false));
            }

            setStatus(false, '연결 중...');
            const socket = new SockJS("/ws");
            stompClient = Stomp.over(socket);
            stompClient.debug = null;

            stompClient.connect({}, async () => {
                setStatus(true);

                stompClient.subscribe(`/sub/channels/${currentChannel}`, (frame) => {
                    const msg = JSON.parse(frame.body);
                    const mine = (msg.sender || "") === sender();
                    renderMessage(msg, mine);
                });

                stompClient.subscribe(`/sub/channels/${currentChannel}/presence`, (frame) => {
                    renderPresence(JSON.parse(frame.body));
                });

                stompClient.send(`/pub/channels/${currentChannel}/join`, {}, JSON.stringify({ sender: sender(), content: "joined" }));
                await refreshAccess();
                await loadHistory();
                await loadChannels();
                await loadOnlineUsers();
                showToast(`${currentChannel} 채널 입장 완료`);
            }, () => {
                setStatus(false);
                showToast('연결에 실패했습니다. 서버 상태를 확인해 주세요.');
            });
        }

        async function sendMsg() {
            if (!stompClient || !stompClient.connected) {
                connect();
                return;
            }

            const text = contentEl.value.trim();
            if (!sender() || !text) return;

            await refreshAccess();
            if (!permLabelEl.textContent.includes("쓰기 가능")) {
                showToast('이 채널에 쓰기 권한이 없습니다.');
                return;
            }

            stompClient.send(`/pub/channels/${currentChannel}`, {}, JSON.stringify({ sender: sender(), content: text }));
            contentEl.value = "";
            contentEl.focus();
        }

        async function loadHistory() {
            try {
                const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/messages?sender=${encodeURIComponent(sender())}&limit=50`);
                const data = await res.json().catch(() => ([]));
                if (!res.ok) {
                    clearMessages();
                    renderMessage({ sender: "시스템", content: extractErrorMessage(data, "대화 기록 로드 실패"), sentAt: new Date() }, false);
                    return;
                }
                clearMessages();
                data.forEach(msg => renderMessage(msg, (msg.sender || "") === sender()));
            } catch {
                showToast('대화 기록을 불러오지 못했습니다.');
            }
        }

        async function loadChannels() {
            try {
                const res = await fetch('/api/channels');
                if (!res.ok) throw new Error();
                const channels = await res.json();
                channelListEl.innerHTML = "";

                channels.forEach(ch => {
                    const btn = document.createElement("button");
                    btn.className = "channel-item" + (ch === currentChannel ? " active" : "");
                    btn.textContent = `# ${ch}`;
                    btn.onclick = () => moveChannel(ch);

                    const dragEnabled = currentRole === "ADMIN" && manageModeEl.checked;
                    btn.draggable = dragEnabled;

                    if (dragEnabled) {
                        btn.addEventListener("dragstart", () => dragChannel = ch);
                        btn.addEventListener("dragover", (e) => e.preventDefault());
                        btn.addEventListener("drop", async (e) => {
                            e.preventDefault();
                            if (!dragChannel || dragChannel === ch) return;
                            const updated = [...channels];
                            const from = updated.indexOf(dragChannel);
                            const to = updated.indexOf(ch);
                            if (from < 0 || to < 0) return;
                            updated.splice(from, 1);
                            updated.splice(to, 0, dragChannel);
                            await reorderChannels(updated);
                        });
                    }

                    channelListEl.appendChild(btn);
                });
            } catch {
                showToast('채널 목록을 불러오지 못했습니다.');
            }
        }

        async function moveChannel(channelId) {
            currentChannel = channelId;
            updateRoomTitle();
            connect();
        }

        async function addChannel() {
            const channelName = newChannelNameEl.value.trim();
            if (!channelName) return;

            const res = await fetch(`/api/admin/channels?sender=${encodeURIComponent(sender())}&channelId=${encodeURIComponent(channelName)}`, { method: "POST" });
            const data = await res.json().catch(() => ([]));
            if (!res.ok) {
                showToast(extractErrorMessage(data, "채널 추가 실패"));
                return;
            }

            newChannelNameEl.value = "";
            showToast(`채널 #${channelName} 추가 완료`);
            await loadChannels();
        }

        async function reorderChannels(nextOrder) {
            const res = await fetch(`/api/admin/channels/reorder?sender=${encodeURIComponent(sender())}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ channelIds: nextOrder })
            });

            const data = await res.json().catch(() => ([]));
            if (!res.ok) {
                showToast(extractErrorMessage(data, "채널 순서 변경 실패"));
                return;
            }
            await loadChannels();
        }

        async function loadOnlineUsers() {
            try {
                const res = await fetch(`/api/channels/${encodeURIComponent(currentChannel)}/online-users?sender=${encodeURIComponent(sender())}`);
                const data = await res.json().catch(() => ({}));
                if (!res.ok) {
                    renderPresence({ users: [], onlineCount: 0 });
                    return;
                }
                renderPresence(data);
            } catch {
                showToast('온라인 사용자 목록 조회 실패');
            }
        }

        async function setUserRole() {
            const target = adminTargetUserEl.value.trim();
            const role = document.getElementById("adminRole").value;
            if (!target) return;

            const res = await fetch(`/api/admin/users/${encodeURIComponent(target)}/role?actor=${encodeURIComponent(sender())}&role=${encodeURIComponent(role)}`, { method: "POST" });
            if (!res.ok) {
                showToast("역할 변경 실패");
                return;
            }
            showToast(`${target} 역할이 ${role}로 변경됨`);
            await refreshAccess();
            loadOnlineUsers();
        }

        async function setChannelPermission() {
            const role = document.getElementById("permRole").value;
            const canRead = document.getElementById("canRead").checked;
            const canWrite = document.getElementById("canWrite").checked;

            const res = await fetch(`/api/admin/channels/${encodeURIComponent(currentChannel)}/permissions?sender=${encodeURIComponent(sender())}&role=${encodeURIComponent(role)}&canRead=${canRead}&canWrite=${canWrite}`, { method: "POST" });
            if (!res.ok) {
                const errorData = await res.json().catch(() => ({}));
                showToast(extractErrorMessage(errorData, '채널 권한 변경 실패'));
                return;
            }
            showToast(`${role} 권한 변경 완료`);
            await refreshAccess();
        }

        function editProfile() {
            const next = prompt("새 닉네임을 입력하세요.", sender());
            if (!next || !next.trim()) return;
            applyNickname(next);
            localStorage.setItem('chat.nickname', sender());
            refreshAccess();
            loadOnlineUsers();
            showToast("닉네임이 변경되었습니다.");
        }

        function logout() {
            localStorage.removeItem('chat.nickname');
            window.location.href = '/login.html';
        }

        function openMessageMenu(messageId, x, y) {
            selectedMessageId = messageId;
            messageMenuEl.style.left = `${x}px`;
            messageMenuEl.style.top = `${y}px`;
            messageMenuEl.classList.remove("hidden");
        }

        function hideMessageMenu() {
            messageMenuEl.classList.add("hidden");
            selectedMessageId = null;
        }

        async function onMessageMenuClick(event) {
            const action = event.target?.dataset?.action;
            if (!action || !selectedMessageId) return;

            if (action === "edit") {
                const next = prompt("수정할 메시지 내용을 입력하세요.");
                if (!next || !next.trim()) {
                    hideMessageMenu();
                    return;
                }

                const res = await fetch(`/api/admin/channels/${encodeURIComponent(currentChannel)}/messages/${selectedMessageId}?sender=${encodeURIComponent(sender())}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ content: next.trim() })
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    showToast(extractErrorMessage(errorData, "메시지 수정 실패"));
                    hideMessageMenu();
                    return;
                }

                showToast("메시지 수정 완료");
                await loadHistory();
            }

            if (action === "delete") {
                const ok = confirm(`메시지 #${selectedMessageId}를 삭제할까요?`);
                if (!ok) {
                    hideMessageMenu();
                    return;
                }

                const res = await fetch(`/api/admin/channels/${encodeURIComponent(currentChannel)}/messages/${selectedMessageId}?sender=${encodeURIComponent(sender())}`, {
                    method: "DELETE"
                });

                if (!res.ok) {
                    const errorData = await res.json().catch(() => ({}));
                    showToast(extractErrorMessage(errorData, "메시지 삭제 실패"));
                    hideMessageMenu();
                    return;
                }

                showToast("메시지 삭제 완료");
                await loadHistory();
            }

            hideMessageMenu();
        }

        function escapeHtml(str) {
            return String(str)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        updateRoomTitle();
        loadChannels();
        refreshAccess();
        connect();
    </script>
</body>

</html>
